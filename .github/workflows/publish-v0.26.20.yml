name: Publish ML Gallery Pro v0.26.20

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release-v0-26-20:
    if: github.repository == 'mlopesdesign/ml-gallery-pro'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard exact release version
        shell: bash
        run: |
          header=$(grep -E '^\s*\*\s*Version:' ml-gallery-pro/ml-gallery-pro.php | head -1 | sed -E 's/.*Version:\s*([0-9.]+).*/\1/')
          stable=$(grep -E '^Stable tag:' ml-gallery-pro/readme.txt | head -1 | awk '{print $3}')
          test "$header" = "0.26.20"
          test "$stable" = "0.26.20"
          echo "OK: version $header / stable $stable"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate synchronized version
        run: bash scripts/sync-version.sh

      - name: PHP syntax
        run: find ml-gallery-pro -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: JS syntax
        shell: bash
        run: |
          for f in $(find ml-gallery-pro -name "*.js"); do
            node --check "$f"
          done

      - name: Package ZIP
        run: bash scripts/package.sh "0.26.20"

      - name: Capture ZIP metadata
        id: hash
        working-directory: dist
        shell: bash
        run: |
          f=$(ls ML-Gallery-Pro-v0_26_20.zip)
          echo "name=$f" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s "$f")" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$f" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.26.20
          target_commitish: main
          name: ML Gallery Pro v0.26.20
          body: |
            Corrige a acumulacao combinatoria de parametros publicos MLGP no frontend.

            - impede proliferacao de URLs com multiplos mlgp_album_view_*;
            - limpa estados de paginacao MLGP concorrentes;
            - normaliza URLs legadas com multiplos estados;
            - preserva parametros nao relacionados;
            - mantem compatibilidade com ML Carousel Gallery Pro v1.10.13;
            - preserva slug, shortcodes, capas, albuns, galerias, licenca, updater e banco.

            ZIP: ${{ steps.hash.outputs.name }}
            SHA-256: ${{ steps.hash.outputs.sha256 }}
            Tamanho: ${{ steps.hash.outputs.size }} bytes
          files: dist/ML-Gallery-Pro-v0_26_20.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
